<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Agregar habitación</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px;
            color: #243447;
        }

        .contenedor {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #2563eb;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <h1>🏨 Agregar habitación</h1>

        <p>
            Hotel:
            <strong>{{ hotel.nombre }}</strong>
        </p>

        <form method="POST">

            {% csrf_token %}

            <label for="numero">
                Número de habitación
            </label>

            <input
                type="text"
                id="numero"
                name="numero"
                required
            >

            <label for="tipo">
                Tipo de habitación
            </label>

            <input
                type="text"
                id="tipo"
                name="tipo"
                placeholder="Ejemplo: Individual, Doble, Suite"
                required
            >

            <label for="precio">
                Precio por noche
            </label>

            <input
                type="number"
                id="precio"
                name="precio"
                step="0.01"
                min="0"
                required
            >

            <button type="submit">
                ➕ Agregar habitación
            </button>

        </form>

        <a
            href="{% url 'mi_panel' %}"
            class="volver"
        >
            ← Volver al panel
        </a>

    </div>

</body>

</html>
