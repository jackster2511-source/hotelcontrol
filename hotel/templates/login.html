<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HotelControl | Iniciar sesión</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #25364a;
        }

        .contenedor {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            font-size: 32px;
        }

        .logo p {
            color: #6b7280;
            margin-top: 10px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #3566c7;
        }

        button {
            width: 100%;
            border: none;
            background: #3566c7;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #244d9c;
        }

        .error {
            background: #fdeaea;
            color: #b42318;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .volver {
            text-align: center;
            margin-top: 25px;
        }

        .volver a {
            color: #3566c7;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="login">

            <div class="logo">
                <h1>🏨 HotelControl</h1>

                <p>
                    Inicia sesión para administrar tu hotel
                </p>
            </div>


            {% if mensaje_error %}

                <div class="error">
                    {{ mensaje_error }}
                </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <label for="username">
                    Usuario
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >


                <button type="submit">
                    Iniciar sesión
                </button>

            </form>


            <div class="volver">

                <a href="{% url 'inicio' %}">
                    ← Volver al inicio
                </a>

            </div>

        </div>

    </div>

</body>
</html>
