<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reservar habitación</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px;
            color: #243447;
        }

        .contenedor {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: bold;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #2563eb;
        }

    </style>
</head>

<body>

    <div class="contenedor">

        <h1>
            📅 Reservar habitación {{ habitacion.numero }}
        </h1>

        <p>
            <strong>Tipo:</strong>
            {{ habitacion.tipo }}
        </p>

        <p>
            <strong>Precio:</strong>
            ${{ habitacion.precio }}
        </p>


        {% if mensaje_error %}

            <div class="error">
                ⚠️ {{ mensaje_error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <label for="nombre_huesped">
                Nombre del huésped
            </label>

            <input
                type="text"
                id="nombre_huesped"
                name="nombre_huesped"
                required
            >


            <label for="fecha_entrada">
                Fecha de entrada
            </label>

            <input
                type="date"
                id="fecha_entrada"
                name="fecha_entrada"
                required
            >


            <label for="fecha_salida">
                Fecha de salida
            </label>

            <input
                type="date"
                id="fecha_salida"
                name="fecha_salida"
                required
            >


            <button type="submit">
                Confirmar reservación
            </button>

        </form>


        <a
            href="{% url 'detalle_habitacion' habitacion.id %}"
            class="volver"
        >
            ← Volver a la habitación
        </a>

    </div>

</body>
</html>
